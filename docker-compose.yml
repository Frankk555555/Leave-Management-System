services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: leave_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/schema_v2.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./server/database/add_performance_indexes.sql:/docker-entrypoint-initdb.d/2-indexes.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: dev_jwt_secret_change_me
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: leave_management
      DB_USER: root
      DB_PASSWORD: root
      UPLOAD_DIR: uploads
      CLIENT_URL: http://localhost:5173
      QUEUE_DRIVER: memory
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./แบบฟอร์มการลา:/แบบฟอร์มการลา
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mysql_data:
